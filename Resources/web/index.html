<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="vendor/github-markdown.css">
<link rel="stylesheet" href="vendor/highlight-github.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="vendor/highlight-github-dark.css" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="ogle.css">
<script defer src="vendor/purify.min.js"></script>
<script defer src="vendor/diff.min.js"></script>
<script defer src="vendor/highlight.min.js"></script>
<script defer src="vendor/mermaid.min.js"></script>
<script defer src="ogle.js"></script>
</head>
<body>
<section id="welcome" hidden>
  <h1 id="start-title">Ogle at any Markdown file</h1>
  <div class="welcome-grid">
    <section class="start" aria-label="Open a Markdown file">
      <div class="start-top">
        <svg class="start-eye" viewBox="0 0 200 200" aria-hidden="true">
          <defs>
            <radialGradient id="eye-white" cx="0.45" cy="0.4" r="0.6"><stop offset="0.6" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E4E4DB"/></radialGradient>
            <radialGradient id="eye-iris" cx="0.5" cy="0.5" r="0.5" fx="0.4" fy="0.35"><stop offset="0" stop-color="#E4FF9A"/><stop offset="0.55" stop-color="#C6F05A"/><stop offset="0.85" stop-color="#93B82C"/><stop offset="1" stop-color="#5F7A15"/></radialGradient>
            <radialGradient id="eye-pupil" cx="0.5" cy="0.5" r="0.5" fx="0.42" fy="0.38"><stop offset="0" stop-color="#3A3F47"/><stop offset="1" stop-color="#0B0C0E"/></radialGradient>
            <linearGradient id="eye-gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
            <filter id="eye-lift" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000000" flood-opacity="0.4"/></filter>
            <clipPath id="eye-clip"><circle cx="100" cy="100" r="97"/></clipPath>
          </defs>
          <circle cx="100" cy="100" r="97" fill="url(#eye-white)"/>
          <circle cx="100" cy="100" r="94.5" fill="none" stroke="#000000" stroke-opacity="0.1" stroke-width="5"/>
          <g clip-path="url(#eye-clip)">
            <ellipse cx="108" cy="130" rx="64" ry="56" fill="#000000" opacity="0.14"/>
            <circle cx="104" cy="120" r="65" fill="url(#eye-iris)" filter="url(#eye-lift)"/>
            <circle cx="106" cy="131" r="27" fill="url(#eye-pupil)"/>
            <ellipse cx="94" cy="82" rx="40" ry="21" fill="url(#eye-gloss)"/>
            <circle cx="124" cy="146" r="6" fill="#FFFFFF" opacity="0.6"/>
          </g>
        </svg>
      </div>
      <div class="start-paper">
        <div class="md-lines" aria-hidden="true"><span></span><span></span></div>
        <div class="md-lines md-lines-right" aria-hidden="true"><span></span><span></span></div>
        <div class="drop-zone">
          <p>Drop a .md file here</p>
          <button type="button" class="primary" data-action="open">Open File…</button>
        </div>
      </div>
    </section>
    <section class="quick" aria-labelledby="quick-title">
      <div class="quick-header">
        <h2 id="quick-title">Open Quickly</h2>
        <kbd>⇧⌘O</kbd>
      </div>
      <div class="quick-search">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"></circle><path d="M10.5 10.5 14 14"></path></svg>
        <input id="quick-search" type="search" placeholder="Search recent files and folders" aria-label="Search recent files" aria-controls="quick-list" autocomplete="off" spellcheck="false">
      </div>
      <ul id="quick-list" role="listbox" aria-label="Recent files"></ul>
      <p id="quick-empty" hidden>Files you open show up here.</p>
      <div class="quick-footer">
        <span><kbd>↩</kbd> Open</span>
        <span><kbd>⌥↩</kbd> Open with Neovim</span>
        <span><kbd>⌘⌫</kbd> Remove from list</span>
      </div>
    </section>
  </div>
  <div class="welcome-footer">
    <p class="hint">Or from a terminal: <code>ogle README.md</code></p>
  </div>
</section>
<article id="content" class="markdown-body"></article>
</body>
</html>
