<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="vendor/github-markdown.css">
<link rel="stylesheet" href="vendor/highlight-github.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="vendor/highlight-github-dark.css" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="ogle.css">
<script defer src="vendor/purify.min.js"></script>
<script defer src="vendor/diff.min.js"></script>
<script defer src="vendor/highlight.min.js"></script>
<script defer src="vendor/mermaid.min.js"></script>
<script defer src="ogle.js"></script>
</head>
<body>
<section id="welcome" hidden>
  <div class="welcome-grid">
    <section class="start" aria-labelledby="start-title">
      <img src="icon.svg" width="104" height="104" alt="">
      <h1 id="start-title">Ogle at any Markdown file</h1>
      <div class="drop-zone">
        <p>Drop a .md file here</p>
        <button type="button" class="primary" data-action="open">Open File…</button>
      </div>
      <p class="hint">From a terminal: <code>ogle README.md</code></p>
    </section>
    <section class="quick" aria-labelledby="quick-title">
      <div class="quick-header">
        <h2 id="quick-title">Open Quickly</h2>
        <kbd>⇧⌘O</kbd>
      </div>
      <div class="quick-search">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"></circle><path d="M10.5 10.5 14 14"></path></svg>
        <input id="quick-search" type="search" placeholder="Search recent files and folders" aria-label="Search recent files" aria-controls="quick-list" autocomplete="off" spellcheck="false">
      </div>
      <ul id="quick-list" role="listbox" aria-label="Recent files"></ul>
      <p id="quick-empty" hidden>Files you open show up here.</p>
      <div class="quick-footer">
        <span><kbd>↩</kbd> Open</span>
        <span><kbd>⌥↩</kbd> Open with Neovim</span>
        <span><kbd>⌘⌫</kbd> Remove from list</span>
      </div>
    </section>
  </div>
</section>
<article id="content" class="markdown-body"></article>
</body>
</html>
