name: Package

# Pushing a tag like v1.2.0 publishes a GitHub release with Ogle.zip.
# Running the workflow manually only uploads Ogle.zip as a workflow artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: plutil -replace CFBundleShortVersionString -string "${GITHUB_REF_NAME#v}" Resources/Info.plist

      - name: Build
        run: ./build.sh

      - name: Package
        run: ditto -c -k --keepParent build/Ogle.app Ogle.zip

      - uses: actions/upload-artifact@v7
        with:
          name: Ogle
          path: Ogle.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Ogle.zip --title "Ogle $GITHUB_REF_NAME" --generate-notes
